<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f5f5f6;
            --line: #e7e7e9;
            --text: #1c1c1e;
            --muted: #8d8d93;
            --hover: #ececed;
            --active: #e4e4e7;
            --card: #ffffff;
            --soft: #f3f3f4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 268px;
            background: var(--sidebar);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 16px 12px 14px;
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 16px;
        }
        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #1f8a4c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }
        .brand-name { font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
        .brand-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            text-align: left;
        }
        .new-chat-btn:hover { background: var(--hover); }
        .plus {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #c8c8cc;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
            color: #444;
        }

        .side-label {
            margin: 18px 12px 8px;
            font-size: 12px;
            color: var(--muted);
        }
        .history-list { flex: 1; overflow-y: auto; }
        .history-item {
            margin: 0 4px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--active);
            font-size: 14px;
            line-height: 1.4;
        }
        .history-item small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }
        .side-foot {
            padding: 12px 8px 0;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }
        .chat-header {
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            font-weight: 650;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px 170px;
        }
        .thread {
            width: 100%;
        }
        .message-row { margin-bottom: 22px; }
        .message-row.user .message-content {
            font-size: 18px;
            font-weight: 650;
            line-height: 1.5;
        }
        .message-row.bot .message-content {
            font-size: 15px;
            line-height: 1.75;
            color: #242426;
        }
        .message-content p { margin-bottom: 10px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin: 8px 0 12px 22px; }
        .message-content li { margin: 4px 0; }
        .message-content pre {
            background: #f6f8fa;
            border: 1px solid var(--line);
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .message-content code {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
        }
        .message-content :not(pre) > code {
            background: var(--soft);
            padding: 1px 5px;
            border-radius: 4px;
        }
        .thinking { color: var(--muted); }

        .input-area-wrapper {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0 32px 22px;
            background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28%);
            pointer-events: none;
        }
        .input-area {
            pointer-events: auto;
            width: 100%;
            background: var(--card);
            border: 1px solid #dddde1;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
            padding: 12px 12px 10px 16px;
        }
        .input-area textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            font-family: inherit;
            max-height: 200px;
            padding: 4px 0 8px;
        }
        .input-area textarea::placeholder { color: #b0b0b6; }
        .composer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .hint { font-size: 12px; color: var(--muted); }
        .send-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #d9d9de;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .send-btn.active { background: #1c1c1e; }
        .send-btn:disabled { cursor: default; }

        .main-chat { position: relative; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">知</div>
            <div>
                <div class="brand-name">知识库助手</div>
                <div class="brand-sub">本地文档问答</div>
            </div>
        </div>
        <button class="new-chat-btn" onclick="clearChat()">
            <span class="plus">+</span> 新建对话
        </button>
        <div class="side-label">对话</div>
        <div class="history-list">
            <div class="history-item">
                当前对话
                <small>知识库</small>
            </div>
        </div>
        <div class="side-foot">回答来自已入库的文档</div>
    </aside>

    <div class="main-chat">
        <div class="chat-header">知识库问答</div>
        <div class="chat-messages" id="chatMessages">
            <div class="thread" id="thread">
                <div class="message-row bot">
                    <div class="message-content">你好。可以问我已经放进知识库的文档，我会根据资料回答。</div>
                </div>
            </div>
        </div>

        <div class="input-area-wrapper">
            <div class="input-area">
                <textarea id="questionInput" placeholder="询问知识库中的内容..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                <div class="composer-bar">
                    <span class="hint">Enter 发送，Shift+Enter 换行</span>
                    <button class="send-btn" id="sendButton" onclick="sendMessage()" title="发送">↑</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const thread = document.getElementById('thread');
        const questionInput = document.getElementById('questionInput');
        const sendButton = document.getElementById('sendButton');

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            sendButton.classList.toggle('active', textarea.value.trim().length > 0);
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            thread.innerHTML = `
                <div class="message-row bot">
                    <div class="message-content">你好。可以问我已经放进知识库的文档，我会根据资料回答。</div>
                </div>`;
            chatMessages.scrollTop = 0;
        }

        function appendMessage(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const content = document.createElement('div');
            content.className = 'message-content';
            if (sender === 'user') {
                content.innerText = text;
            } else {
                content.innerHTML = marked.parse(text);
            }

            row.appendChild(content);
            thread.appendChild(row);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return content;
        }

        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question) return;

            appendMessage(question, 'user');
            questionInput.value = '';
            questionInput.style.height = 'auto';
            sendButton.classList.remove('active');
            sendButton.disabled = true;

            const botContent = appendMessage('正在检索知识库并思考...', 'bot');
            botContent.classList.add('thinking');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) throw new Error('后端响应错误');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let full = "";
                botContent.textContent = "";
                botContent.classList.remove('thinking');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    full += decoder.decode(value, { stream: true });
                    botContent.innerHTML = marked.parse(full);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                botContent.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } catch (error) {
                botContent.classList.remove('thinking');
                botContent.innerHTML = `<span style="color: #c24141;">出错了: ${error.message}</span>`;
            } finally {
                sendButton.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
    </script>
</body>
</html>
